name: Publish to WinGet
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Tag of the release to publish (e.g. v1.20.0)'
        required: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: jens-duttke.usage-monitor-for-claude
          release-tag: ${{ inputs.release-tag || github.event.release.tag_name }}
          installers-regex: '^Claude&CodexUsage\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
